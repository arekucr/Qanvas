version = 1

; Router mode. The app uses only pe-i2i (for text and photo prompts), so the model never swaps.
; Nothing loads at startup: the app primes it when it has its own GPU, or loads it on demand when shared.
[*]
n-gpu-layers = 99
c = 16384
parallel = 1

[pe-i2i]
model = /models/pe-i2i-Q4_K_M.gguf
mmproj = /models/pe-i2i-mmproj-bf16.gguf
