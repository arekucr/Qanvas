version = 1

; Router mode: only one enhancer is loaded at a time (--models-max 1); they swap on demand.
; Nothing loads at startup: the app primes pe-t2i when it has its own GPU, or loads on demand when shared.
[*]
n-gpu-layers = 99
c = 16384
parallel = 1

[pe-t2i]
model = /models/pe-t2i-Q4_K_M.gguf

[pe-i2i]
model = /models/pe-i2i-Q4_K_M.gguf
mmproj = /models/pe-i2i-mmproj-bf16.gguf
